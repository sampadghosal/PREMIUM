
name: Silent Premium Bot Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: silent-premium-watchdog
  cancel-in-progress: true

jobs:
  check-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check and restart bot if stopped
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Checking Silent Premium Bot..."

          WORKFLOW_FILE="run-bot.yml"

          ACTIVE_RUNS=$(
            gh api \
              "repos/$GH_REPO/actions/workflows/$WORKFLOW_FILE/runs?per_page=100" |
            jq '[
              .workflow_runs[] |
              select(
                .status == "queued" or
                .status == "in_progress" or
                .status == "waiting" or
                .status == "requested" or
                .status == "pending"
              )
            ] | length'
          )

          echo "Active main workflow runs: $ACTIVE_RUNS"

          if [ "$ACTIVE_RUNS" -gt 0 ]; then
            echo "Main workflow is active. No restart needed."
            exit 0
          fi

          echo "No active run found. Dispatching main workflow..."

          gh api --method POST \
            "repos/$GH_REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
            -f ref=main

          echo "Restart request sent successfully."
